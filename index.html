<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الفندق - التابولكا</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h2>Fayed Resort</h2>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="login()" class="save-btn">دخول</button>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <div class="sidebar">
            <h2>لوحة الإدارة</h2>
            <button onclick="showSection('housing')">الإسكان</button>
            <button onclick="showSection('restaurant')">المطعم</button>
            <button onclick="showSection('cafeteria')">الكافتيريا</button>
            <button onclick="showSection('inventory')">إدارة المخزن</button>
            <button onclick="showSection('accounts')">الحسابات</button>
            <button onclick="logout()" style="background: #e74c3c; margin-top: 50px;">تسجيل خروج</button>
        </div>

        <div class="main-content" id="mainContent">
            <h1>مرحباً بك في نظام إدارة --فايد-- ريزورت</h1>
            <h3>يرجى اختيار القسم المطلوب من القائمة الجانبية.</h3>
        </div>
    </div>

    

    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
